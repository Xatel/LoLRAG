services:
  db:
    image: pgvector/pgvector:pg17
    container_name: lolrag-vector-db
    restart: unless-stopped
    env_file: ../../.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  pgdata: